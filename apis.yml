aid: innovaccer
name: Innovaccer
description: >-
  Innovaccer is a healthcare AI cloud company whose FHIR-enabled Data Activation
  Platform unifies fragmented patient and clinical data across EHRs, claims, and
  other sources into a longitudinal record that powers population health, care
  management, analytics, and agentic healthcare applications. The company is HITRUST
  CSF certified and publishes open-source developer surfaces including the Masala
  Design System (a React component library) and the Healthcare Model Context Protocol
  (HMCP), an OAuth 2.0 / SMART on FHIR protocol for healthcare AI agents. Its core
  platform API is offered to customers and partners through the Innovaccer developer
  portal (Nucleus / Datashop Engine).
