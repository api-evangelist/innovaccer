notes: >-
  First-party Innovaccer packages published on npm under the @innovaccer scope.
  These are client-side libraries for the open-source Masala Design System (MDS)
  and an MCP server for it, not SDKs for the Innovaccer healthcare data platform
  API (that platform is gated behind the developer portal at developer.innovaccer.com,
  and Innovaccer publishes no client library for it in any registry).
  Every version/published pair below was read from registry.npmjs.org on 2026-08-15.
currency_summary: >-
  The design system itself is actively maintained (4.27.0 shipped 2026-08-04).
  Two satellites have decayed: @innovaccer/charts has not been republished since
  2021-04-24 (five years) despite the docs still listing charts as an MDS family,
  and @innovaccer/mds-ai has a GitHub repository and a docs site but was never
  published to npm at all. @innovaccer/mds-mcp is npm-current but still on a
  prerelease dist-tag.
