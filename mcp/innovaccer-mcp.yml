- name: Healthcare Model Context Protocol (HMCP)
  status: specification
  transport:
  - sse
  - streamable-http
  repository: https://github.com/innovaccer/Healthcare-MCP
  version: 0.0.4
  description: Open protocol (a healthcare-oriented extension of Anthropic's MCP) for secure, interoperable
    communication between healthcare agentic applications. Implements OAuth 2.0 / SMART on FHIR, PKCE,
    encryption, audit logging, and rate limiting for HIPAA-aligned agent-to-agent workflows. Adds MCP
    `sampling` to the SERVER side for bidirectional agent-to-agent messaging, and declares guardrails
    (NVIDIA NeMo Guardrails) under the server's `experimental` capabilities. Python reference
    implementation; not published to PyPI (pypi.org/pypi/hmcp/json -> 404, checked 2026-08-15; the README
    still gives "temporary steps till the package isn't published"). No public hosted endpoint.
  spec_docs: https://github.com/innovaccer/Healthcare-MCP/tree/main/docs/specification
- name: Innovaccer HMCP Cloud Gateway
  status: commercial
  description: >-
    Innovaccer markets a hosted HMCP gateway that registers agents and data sources,
    enforces policy-driven context and guardrails, and resolves patient identity via
    EMPI. No public endpoint URL, no anonymous documentation and no /.well-known/
    discovery document is published for it, so it is recorded here as a commercial
    offering rather than as a reachable MCP server.
  source: https://innovaccer.com/gravity/resources/stories/introducing-hmcp-a-universal-open-standard-for-ai-in-healthcare
